<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="utf-8">
    <title>本地知识库 RAG 系统</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100">
    <!-- 固定 Logo -->
    <div id="fixed-logo" class="flex items-center gap-3">
        <i class="fa-solid fa-brain text-3xl text-blue-600"></i>
        <div>
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white">本地知识库</h1>
            <p class="text-xs text-gray-500 -mt-1">RAG 系统</p>
        </div>
    </div>

    <div class="flex h-screen overflow-hidden">
        <!-- 左侧文件列表 -->
        <div id="sidebar" class="sidebar w-64 border-r border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 flex flex-col overflow-hidden">
            <div class="p-5 border-b border-gray-200 dark:border-gray-800 flex-shrink-0 pt-16">
                <h1 class="text-xl font-semibold text-gray-700 dark:text-gray-300">文件列表</h1>
            </div>

            <!-- 上传区域 -->
            <div class="p-3 border-t border-gray-200 dark:border-gray-800">
                <button onclick="document.getElementById('fileUpload').click()" 
                        class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-2xl font-medium transition">
                    <i class="fa-solid fa-upload"></i> 上传新文件
                </button>
                <input id="fileUpload" type="file" class="hidden" onchange="handleFileUpload(this.files[0])">
            </div>

            <div id="uploadProgress" class="hidden px-3 pb-3">
                <div class="text-xs text-gray-500 mb-1 flex justify-between"><span>解析进度</span><span id="progressText">0%</span></div>
                <div class="h-2 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                    <div id="progressBar" class="h-2 bg-blue-600 transition-all duration-300" style="width:0%"></div>
                </div>
            </div>

            <div class="p-3 flex-shrink-0">
                <div class="relative">
                    <input id="fileSearch" type="text" placeholder="搜索文件..." class="w-full bg-gray-100 dark:bg-gray-800 border border-transparent focus:border-blue-500 rounded-2xl px-4 py-2.5 text-sm focus:outline-none">
                    <i class="fa-solid fa-magnifying-glass absolute right-4 top-3 text-gray-400"></i>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-3 min-h-0" id="fileList"></div>

            <div class="p-3 border-t border-gray-200 dark:border-gray-800 text-xs text-gray-500 dark:text-gray-400 text-center flex-shrink-0">
                共 <span id="totalCount" class="font-semibold text-emerald-600">0</span> 个文件
            </div>
        </div>

        <!-- 主聊天区 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <div class="h-14 border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 px-5 flex items-center justify-between flex-shrink-0 pl-80">
                <div class="flex items-center gap-3">
                    <button id="toggleBtn" onclick="toggleSidebar()" class="p-3 rounded-2xl hover:bg-blue-50 dark:hover:bg-gray-800 transition">
                        <i id="sidebarToggleIcon" class="fa-solid fa-chevron-left text-2xl text-gray-700 dark:text-gray-300"></i>
                    </button>
                </div>

                <div class="flex items-center gap-5">
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-medium">云端模式</span>
                        <label class="relative inline-flex cursor-pointer">
                            <input type="checkbox" id="cloudToggle" onchange="toggleCloudMode()" checked class="sr-only peer">
                            <div class="w-10 h-5 bg-gray-300 peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-5"></div>
                        </label>
                    </div>
                    <button onclick="toggleDarkMode()" class="p-2.5 rounded-2xl hover:bg-gray-100 dark:hover:bg-gray-800">
                        <i id="themeIcon" class="fa-solid fa-moon"></i>
                    </button>
                    <button onclick="clearChat()" class="flex items-center gap-2 px-4 py-1.5 text-red-600 hover:bg-red-50 dark:hover:bg-red-950 rounded-2xl text-sm font-medium">
                        <i class="fa-solid fa-trash"></i> 清空
                    </button>
                </div>
            </div>

            <div id="chat" class="flex-1 overflow-y-auto p-6 chat-container space-y-6 bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] dark:bg-[radial-gradient(#374151_1px,transparent_1px)] bg-[length:20px_20px]"></div>

            <div class="p-5 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 flex-shrink-0">
                <div class="max-w-4xl mx-auto flex gap-3">
                    <textarea id="input" rows="1" class="flex-1 resize-y max-h-32 bg-gray-100 dark:bg-gray-800 border border-transparent focus:border-blue-500 rounded-3xl px-6 py-4 text-base focus:outline-none" placeholder="输入问题，按 Enter 发送..."></textarea>
                    <button onclick="sendMessage()" class="w-12 h-12 bg-blue-600 hover:bg-blue-700 text-white rounded-3xl flex items-center justify-center shadow-lg transition">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
